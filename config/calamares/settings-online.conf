---
modules-search: [ local ]

instances: []

sequence:
- show:
  - welcome
  - locale
  - keyboard
  # Sequência online: a pessoa já escolheu "Online" no launcher antes
  # de chegar aqui, então o netinstall sempre entra na sequência. Ainda
  # assim deixamos required: false no netinstall.conf como rede de
  # segurança — se a internet cair no meio do caminho, a página só
  # mostra o aviso em vez de travar a instalação.
  - netinstall
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  # packages aplica tanto os pacotes "fixos" quanto os que o netinstall
  # selecionou (instalação e, quando prefixado com "-", remoção).
  - packages
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: nexiliumos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
