---
# Esse módulo só entra na sequência de settings-online.conf (ver o
# launcher em /usr/local/bin/nexiliumos-installer, que pergunta antes
# se a instalação é offline ou online e escolhe o settings.conf certo).
# A sequência offline (settings-offline.conf) nem inclui "netinstall",
# então nesse caso a página nunca aparece.
#
# required: false aqui é só uma rede de segurança pro caso da pessoa
# escolher "online" mas a internet cair no meio do caminho: TESTADO EM
# VM — nesse caso a página NÃO é pulada automaticamente (contrário do
# que se poderia supor), ela aparece desabilitada com um aviso de que
# não foi possível baixar a lista de pacotes, e a pessoa clica em
# "Próximo" manualmente pra seguir com o KDE Plasma do squashfs.
#
# Troque essa URL pro raw do SEU repositório/branch se mudar de nome.
groupsUrl:
    - "https://raw.githubusercontent.com/zanfss0/NexiliumOS/main/config/calamares/modules/netinstall.yaml"

required: false
sidebar: true

label:
    sidebar: "Ambiente Desktop"
    title: "Seleção de ambiente de desktop"
