---
# Fixa o SDDM como gerenciador de login, não importa qual desktop o
# usuário escolher no seletor online (todos eles vêm com seu próprio
# *dm por dependência, ex: lightdm no XFCE/MATE — isso aqui garante que
# o SDDM continua sendo o padrão configurado no sistema final).
#
# Trocamos de GDM pra SDDM porque o gdm3 no sid passou a depender do
# gnome-shell inteiro (transição gnome-shell-50) — pesado e desnecessário
# numa distro KDE por padrão. SDDM é do próprio time do KDE e não tem
# essa dependência.
displaymanagers:
    - sddm

basicSetup: true
sysconfigSetup: false
